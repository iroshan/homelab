services:

  # AIOMETADATA — Stremio metadata addon (TMDB/TVDB/IMDb enriched posters & catalogs)
  # Configure: https://aiometadata.iroshan.uk/configure
  aiometadata:
    image: ghcr.io/cedya77/aiometadata:latest
    container_name: aiometadata
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/addon/data
    networks:
      - proxy_net
    extends:
      file: ../../shared/dns-config.yml
      service: dns-base
    depends_on:
      - aiometadata_redis
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No ports: block — NPM reaches the container on proxy_net:1337

  # Redis — required by AIOMetadata for caching
  aiometadata_redis:
    image: redis:7-alpine
    container_name: aiometadata_redis
    restart: unless-stopped
    networks:
      - proxy_net
    volumes:
      - ./redis-data:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  proxy_net:
    name: proxy_net
    external: true
