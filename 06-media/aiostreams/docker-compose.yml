services:

  # AIOSTREAMS — Stremio super-addon (stream aggregator + Easynews/Usenet)
  # Dashboard: https://aio.iroshan.uk
  # Configure: https://aio.iroshan.uk/configure
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - proxy_net
    extends:
      file: ../../shared/dns-config.yml
      service: dns-base
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No ports: block — NPM reaches the container on proxy_net:3000

networks:
  proxy_net:
    name: proxy_net
    external: true
